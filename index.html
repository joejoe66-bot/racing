<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>香港賽馬分析</title>
<meta name="theme-color" content="#0D241B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="賽馬分析">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 設計：夜賽大板 —— 深草綠底、琥珀燈數字、翻牌賠率。大板語言只用喺場次、賠率、數字；其他位置保持安靜。 */
  :root {
    color-scheme: light dark;
    /* 大板（兩個模式都保持深色） */
    --board: #0D241B;
    --board-2: #163428;
    --board-3: #1F4535;
    --lamp: #FFC23D;          /* 大板琥珀燈 */
    --lamp-dim: rgba(255, 194, 61, .16);
    --signal: #E8412F;        /* 落飛 / 熱門 */
    --signal-soft: rgba(232, 65, 47, .12);
    --mint: #1F8A57;          /* 回飛 / 著數 */
    --own: #6A4C9C;
    /* 版面（淺色） */
    --bg: #E9EEEA;
    --card: #FFFFFF;
    --raise: #F4F7F5;
    --ink: #13201A;
    --muted: #5C6B63;
    --line: #D9E0DB;
    --bar: #CFE0D6;
    --good: #1F7A4D;
    --bad: #A3523A;
    --glass: rgba(255, 255, 255, .72);
    --shadow: 0 1px 0 rgba(13, 36, 27, .04), 0 8px 24px -12px rgba(13, 36, 27, .25);
    /* 動態 */
    --spring: cubic-bezier(.34, 1.36, .64, 1);
    --out: cubic-bezier(.22, 1, .36, 1);
    --r-l: 18px;
    --r-m: 12px;
    --r-s: 8px;
    --side: 264px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #08140F;
      --card: #0F1E17;
      --raise: #142820;
      --ink: #E6EEE9;
      --muted: #8FA298;
      --line: #1E3329;
      --bar: #23473A;
      --good: #5BD69B;
      --mint: #5BD69B;
      --bad: #EF9273;
      --own: #B8A2E0;
      --signal: #FF5A47;
      --signal-soft: rgba(255, 90, 71, .14);
      --glass: rgba(15, 30, 23, .72);
      --tab-ind: #23503D;
      --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 30px -14px rgba(0, 0, 0, .7);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.55 "Noto Sans TC", system-ui, sans-serif; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  .num { font-family: "Big Shoulders Display", "Barlow Condensed", "Noto Sans TC", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .01em; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  :focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; border-radius: 6px; }

  /* ---------- 骨架 ---------- */
  .side { background: var(--board); color: #fff; position: sticky; top: 0; z-index: 5; padding: calc(10px + env(safe-area-inset-top)) 14px 0;
    background-image: radial-gradient(120% 140% at 100% 0%, rgba(255, 194, 61, .08), transparent 55%); }
  .brand { display: none; }
  /* 底部浮動分頁（手機） */
  .tabs { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6;
    display: grid; grid-template-columns: repeat(3, 1fr); width: min(360px, calc(100% - 32px)); padding: 5px; border-radius: 999px;
    background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
    border: 1px solid var(--line); box-shadow: 0 12px 32px -12px rgba(0, 0, 0, .45); isolation: isolate; }
  .tabs::before { content: ""; position: absolute; z-index: -1; top: 5px; bottom: 5px; left: 5px; width: calc((100% - 10px) / 3); border-radius: 999px;
    background: var(--tab-ind, var(--board)); transform: translateX(calc(var(--ti, 0) * 100%)); transition: transform .45s var(--spring); }
  .tabs button { padding: 10px 0; font-size: 15px; font-weight: 500; color: var(--muted); border-radius: 999px; transition: color .2s; }
  .tabs button[aria-current="page"] { color: var(--lamp); font-weight: 700; }
  .meets { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; }
  .meets::-webkit-scrollbar, .board::-webkit-scrollbar { display: none; }
  .meet { padding: 6px 13px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .18); white-space: nowrap; font-size: 14px; color: rgba(255, 255, 255, .8);
    scroll-snap-align: start; transition: background .2s, color .2s, border-color .2s; }
  .meet[aria-pressed="true"] { background: var(--lamp); color: var(--board); border-color: var(--lamp); font-weight: 700; }
  .board { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 12px; scrollbar-width: none; scroll-snap-type: x proximity; }
  /* 場次牌：小型翻牌 */
  .rno { flex: 0 0 auto; width: 50px; height: 58px; border-radius: var(--r-s); background: var(--board-2); display: grid; place-items: center; align-content: center; gap: 3px;
    line-height: 1; position: relative; color: rgba(255, 255, 255, .62); scroll-snap-align: center; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06); transition: background .25s var(--out), color .25s; }
  .rno::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, .35); }
  .rno b { font-size: 28px; font-weight: 800; color: var(--lamp); }
  .rno small { font-size: 11px; }
  .rno .info { display: none; }
  .rno[aria-current="true"] { background: var(--lamp); color: var(--board); }
  .rno[aria-current="true"] b { color: var(--board); }
  .rno[aria-current="true"]::after { background: rgba(13, 36, 27, .18); }
  .rno .ttb { position: absolute; top: 3px; right: 3px; font-style: normal; font-size: 9px; font-weight: 700; line-height: 1; padding: 2px 3px; border-radius: 4px; background: var(--signal); color: #fff; z-index: 1; }
  main { padding: 16px 14px calc(96px + env(safe-area-inset-bottom)); max-width: 760px; margin: 0 auto; }

  /* iPad 及以上：左邊場次欄，分頁搬去欄頂 */
  @media (min-width: 820px) {
    .app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
    .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 14px 24px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
    .brand { display: block; font-size: 16px; font-weight: 700; letter-spacing: .02em; color: #fff; }
    .brand span { display: block; font-size: 12px; font-weight: 400; color: rgba(255, 255, 255, .55); margin-top: 2px; }
    .tabs { position: relative; left: auto; bottom: auto; transform: none; order: -1; width: auto; background: var(--board-2); border: 0; box-shadow: none;
      -webkit-backdrop-filter: none; backdrop-filter: none; padding: 4px; }
    .tabs::before { top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); background: var(--lamp); }
    .tabs button { padding: 7px 0; font-size: 14px; color: rgba(255, 255, 255, .7); }
    .tabs button[aria-current="page"] { color: var(--board); }
    .brand { order: -2; }
    .meets { flex-wrap: wrap; }
    .meet { font-size: 13px; padding: 5px 10px; }
    .board { flex-direction: column; overflow: visible; padding: 0; gap: 4px; }
    .rno { width: auto; height: auto; grid-template-columns: 46px 1fr; justify-items: start; align-items: center; padding: 9px 10px; gap: 0 10px; text-align: left; }
    .rno::after { display: none; }
    .rno b { font-size: 30px; grid-row: span 2; justify-self: center; }
    .rno small { font-size: 13px; color: #fff; }
    .rno .info { display: block; font-size: 12px; color: rgba(255, 255, 255, .55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .rno:not([aria-current="true"]):hover { background: var(--board-3); }
    .rno[aria-current="true"] small, .rno[aria-current="true"] .info { color: var(--board); }
    .rno .ttb { top: 8px; right: 8px; font-size: 10px; }
    main { padding: 26px 30px 48px; max-width: none; margin: 0; }
  }

  /* ---------- 場次頭：大板 ---------- */
  .rhead { background: var(--board); color: #fff; border-radius: var(--r-l); padding: 18px 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 18px; align-items: center;
    position: relative; overflow: hidden; box-shadow: var(--shadow);
    background-image: linear-gradient(115deg, transparent 55%, rgba(255, 194, 61, .07)), repeating-linear-gradient(0deg, rgba(255, 255, 255, .025) 0 1px, transparent 1px 4px); }
  .rhead .big { font-size: 72px; font-weight: 800; line-height: .86; color: var(--lamp); grid-row: span 2; text-shadow: 0 0 24px rgba(255, 194, 61, .25); }
  .rhead h1 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; }
  .rhead .facts { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: rgba(255, 255, 255, .7); grid-column: 2 / 4; }
  .rhead .facts > span { background: rgba(255, 255, 255, .06); border-radius: 999px; padding: 2px 10px; }
  .rhead .facts b { color: #fff; font-weight: 500; }
  .rhead .clock { grid-column: 3; grid-row: 1; justify-self: end; text-align: right; }
  .clock .num { display: block; font-size: 32px; font-weight: 800; color: var(--lamp); line-height: 1; }
  .clock small { font-size: 12px; color: rgba(255, 255, 255, .6); }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--signal); margin-right: 6px; vertical-align: middle; }
  .refresh { font-size: 14px; font-weight: 700; padding: 8px 16px; border-radius: 999px; background: var(--board); color: var(--lamp); white-space: nowrap; transition: transform .15s var(--out), opacity .2s; }
  .refresh[disabled] { opacity: .6; }
  .rtools { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 10px 4px 0; font-size: 13px; color: var(--muted); }
  .ttbadge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--signal); color: #fff; }
  .rhead .facts > .ttbadge { background: var(--signal); color: #fff; }
  @media (max-width: 480px) {
    .rhead { grid-template-columns: auto 1fr; padding: 16px; gap: 6px 14px; }
    .rhead .big { font-size: 58px; grid-row: auto; }
    .rhead .clock { grid-column: 1 / 3; grid-row: auto; justify-self: start; text-align: left; display: flex; gap: 8px; align-items: baseline; }
    .clock .num { display: inline; font-size: 26px; }
    .rhead .facts { grid-column: 1 / 3; }
  }

  /* ---------- 場次內容排位 ---------- */
  .rcols { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
  .rmain, .rside { display: contents; }
  .o-tips { order: 1; } .o-flow { order: 2; } .o-picks { order: 3; } .o-bias { order: 4; } .o-jday { order: 5; } .o-runners { order: 6; }
  @media (min-width: 1180px) {
    .rcols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; align-items: start; gap: 20px; }
    .rmain { display: flex; flex-direction: column; gap: 14px; }
    .rside { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; scrollbar-width: thin; }
  }
  @media (min-width: 1500px) { .rcols { grid-template-columns: minmax(0, 1fr) 420px; } }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px 18px; box-shadow: var(--shadow); }
  .panel h2 { margin: 0 0 10px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .panel h2 small { font-weight: 400; font-size: 12px; color: var(--muted); }
  .fine { display: block; margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.55; }
  .note { font-size: 13px; color: var(--muted); margin: 6px 0 10px; }

  /* 心水 */
  .tips { border-color: transparent; box-shadow: inset 0 0 0 2px var(--lamp), var(--shadow); }
  .tips .row { display: grid; grid-template-columns: 52px 1fr; gap: 6px 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
  .tips .row:first-of-type { border-top: 0; padding-top: 2px; }
  .tips .row > b { color: var(--muted); font-weight: 700; font-size: 13px; }
  .banker { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .banker .num { font-size: 38px; font-weight: 800; line-height: 1; }
  .banker strong { font-size: 18px; }
  .sub { color: var(--muted); font-size: 13px; width: 100%; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 4px 10px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line); font-size: 13px; }
  .chip.v { background: var(--lamp); border-color: var(--lamp); color: #17201B; font-weight: 700; }

  /* 值博 */
  .picks { background: var(--board); color: #fff; border: 0; }
  .picks h2 { color: var(--lamp); }
  .picks ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .picks li { display: grid; grid-template-columns: 36px 1fr; gap: 0 10px; align-items: baseline; }
  .picks li .num { font-size: 28px; font-weight: 800; color: var(--lamp); grid-row: span 2; }
  .picks li span { font-size: 13px; color: rgba(255, 255, 255, .72); }
  .picks p { margin: 0; font-size: 14px; color: rgba(255, 255, 255, .85); }
  .picks .fine { color: rgba(255, 255, 255, .55); }

  /* 跑道偏差 */
  .bias .bi { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; align-items: baseline; }
  .bias .bi:first-of-type { border-top: 0; }
  .bias .bi .num { font-size: 20px; font-weight: 700; }
  .bias .bi small { grid-column: 1 / 3; font-size: 12px; color: var(--muted); }
  .bias .bi.strong .num, .bias .bi.strong span:first-child { color: var(--good); font-weight: 700; }
  .bias .bi.weak .num { color: var(--bad); }
  .bias .pace { font-size: 13px; margin: 0 0 6px; }
  .bias .pace b { font-family: "Big Shoulders Display", "Barlow Condensed", sans-serif; font-size: 18px; }

  /* 騎師今日 */
  .jtbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  .jtbl th { font-size: 12px; font-weight: 500; color: var(--muted); text-align: right; padding: 0 6px 4px; }
  .jtbl th:first-child, .jtbl td:first-child { text-align: left; padding-left: 0; }
  .jtbl td { padding: 6px; border-top: 1px solid var(--line); text-align: right; }
  .jtbl td .num { font-size: 18px; font-weight: 600; }
  .jtbl tr.hot td:first-child { color: var(--good); font-weight: 700; }
  .jtbl tr.dry td:first-child { color: var(--bad); }

  /* 落飛 */
  .flowbox { border-color: transparent; box-shadow: inset 0 0 0 2px var(--signal), var(--shadow); }
  .flowbox.quiet { box-shadow: var(--shadow); border: 1px dashed var(--line); }
  .flowbox h2 { color: var(--signal); }
  .flowbox.quiet h2 { color: var(--muted); }
  .flowbox p { margin: 0; font-size: 14px; }
  .flowbox .meta { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
  .tblwrap { overflow-x: auto; margin: 6px -4px 0; -webkit-overflow-scrolling: touch; }
  .ftbl { width: auto; min-width: 100%; border-collapse: collapse; font-size: 13px; }
  .ftbl th, .ftbl td { padding: 6px 8px; text-align: right; white-space: nowrap; border-top: 1px solid var(--line); }
  .ftbl th { font-size: 11px; line-height: 1.25; font-weight: 500; color: var(--muted); border-top: 0; vertical-align: bottom; }
  .ftbl th small { font-size: 10px; }
  .ftbl .hn { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; max-width: 132px; overflow: hidden; text-overflow: ellipsis; }
  .ftbl tr.lv3 .hn { box-shadow: inset 3px 0 0 var(--signal); }
  .ftbl tr.lv2 .hn { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--signal) 50%, transparent); }
  .ftbl td.dn { color: var(--signal); }
  .ftbl td.dn2 { color: #fff; background: var(--signal); font-weight: 700; }
  .ftbl td.up { color: var(--good); }
  .ftbl td.last { font-weight: 700; }
  .ftbl .num { font-size: 15px; }
  .ftbl .lvb { font-size: 11px; font-weight: 700; color: var(--signal); }
  .ftbl tr.lv3 .lvb { color: #fff; background: var(--signal); border-radius: 999px; padding: 1px 7px; }
  .fth { font-size: 14px; margin: 14px 0 0; font-weight: 700; cursor: pointer; }
  details.trend summary { list-style: none; padding: 6px 0; }
  details.trend summary::-webkit-details-marker { display: none; }
  details.trend summary::before { content: "▸"; display: inline-block; width: 1em; color: var(--muted); transition: transform .25s var(--spring); }
  details.trend[open] summary::before { transform: rotate(90deg); }
  .fth small { font-weight: 400; color: var(--muted); font-size: 11px; margin-left: 6px; }

  /* ---------- 馬匹 ---------- */
  .runners { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .runner { display: grid; grid-template-columns: 42px minmax(0, 1fr) 80px; gap: 12px; padding: 14px; align-items: start; position: relative;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--shadow); }
  .runner.scr { opacity: .4; }
  .runner.pick { box-shadow: inset 4px 0 0 var(--lamp), var(--shadow); }
  .runner.flow3 { box-shadow: inset 4px 0 0 var(--signal), var(--shadow); background: linear-gradient(90deg, var(--signal-soft), var(--card) 40%); }
  .runner.flow2 { box-shadow: inset 4px 0 0 color-mix(in srgb, var(--signal) 55%, transparent), var(--shadow); }
  /* 馬號：馬布 */
  .cloth { width: 42px; height: 48px; border-radius: 6px 6px 14px 14px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-size: 27px; font-weight: 800; }
  .nm { font-weight: 700; font-size: 17px; line-height: 1.3; }
  .nm small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .who { font-size: 13px; color: var(--muted); }
  .who em { font-style: normal; color: var(--ink); }
  .stats { display: flex; gap: 6px 14px; margin-top: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; align-items: center; }
  .stats .num { font-size: 19px; color: var(--ink); font-weight: 600; }
  .gate { display: inline-flex; align-items: center; gap: 6px; }
  .gate i { display: inline-block; width: 52px; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
  .gate i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w, 0%); background: var(--good); border-radius: 3px; }
  .form { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .form span { min-width: 25px; height: 25px; padding: 0 4px; border-radius: 6px; background: var(--raise); border: 1px solid var(--line); display: grid; place-items: center; font-size: 15px; font-weight: 600; }
  .form span.w { background: var(--lamp); border-color: var(--lamp); color: #17201B; }
  .form span.p { border-color: var(--good); color: var(--good); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; line-height: 1.6; }
  .tag.good { color: var(--good); }
  .tag.bad { color: var(--bad); }
  .tag.info { color: var(--muted); }
  .tag.value { color: #17201B; background: var(--lamp); border-color: var(--lamp); font-weight: 700; }
  .tag.flow3 { background: var(--signal); border-color: var(--signal); color: #fff; font-weight: 700; }
  .tag.flow2 { color: var(--signal); font-weight: 700; }
  .tag.flow1 { color: var(--signal); }
  .tag.own { color: var(--own); }
  .tag.own2 { color: #fff; background: var(--own); border-color: var(--own); font-weight: 700; }
  /* 最後落飛機會：細計量條 */
  .tag.late { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); border-color: var(--line); }
  .tag.late i { width: 36px; height: 5px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
  .tag.late i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: var(--signal); border-radius: 3px; }
  .tag.late b { color: var(--ink); font-weight: 700; }
  .tag.late.hi { border-color: var(--signal); color: var(--signal); }
  .tag.late.hi b { color: var(--signal); }
  .cond { margin-top: 8px; font-size: 12.5px; color: var(--muted); line-height: 1.55; }

  /* 賠率格：翻牌（split-flap） */
  .odds { display: grid; justify-items: end; gap: 5px; }
  .tile { width: 80px; border-radius: var(--r-s); background: var(--board); color: var(--lamp); text-align: center; padding: 7px 0 5px; line-height: 1; position: relative; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 6px 14px -8px rgba(0, 0, 0, .6); perspective: 240px; }
  .tile::after { content: ""; position: absolute; left: 0; right: 0; top: 46%; height: 1px; background: rgba(0, 0, 0, .45); box-shadow: 0 1px 0 rgba(255, 255, 255, .05); }
  .tile .num { font-size: 31px; font-weight: 800; display: block; transform-origin: 50% 46%; }
  .tile small { font-size: 10px; color: rgba(255, 255, 255, .55); }
  .odds.fav .tile { background: var(--signal); color: #fff; }
  .odds.fav .tile small { color: rgba(255, 255, 255, .85); }
  .was { font-size: 11px; color: var(--signal); font-weight: 700; }
  .model { font-size: 12px; color: var(--muted); }
  .model .num { font-size: 17px; font-weight: 700; color: var(--ink); }
  .res { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--lamp); color: #17201B; font-weight: 700; }
  .runner .cloth { grid-column: 1; grid-row: 1 / span 2; }
  .runner .info { grid-column: 2; grid-row: 1; }
  .runner .col2 { grid-column: 2; grid-row: 2; margin-top: -4px; }
  .runner .odds { grid-column: 3; grid-row: 1 / span 2; }
  @media (min-width: 1180px) {
    .runner { grid-template-columns: 46px minmax(0, 1.25fr) minmax(0, 1fr) 86px; gap: 16px; padding: 16px 18px; }
    .runner .cloth { grid-row: 1; }
    .runner .col2 { grid-column: 3; grid-row: 1; margin-top: 0; }
    .runner .col2 > :first-child { margin-top: 0; }
    .runner .odds { grid-column: 4; grid-row: 1; }
    .cloth { width: 46px; height: 52px; font-size: 29px; }
    .tile { width: 86px; }
  }
  @media (max-width: 480px) {
    .runner { grid-template-columns: 36px minmax(0, 1fr) 68px; gap: 10px; padding: 12px; }
    .cloth { width: 36px; height: 42px; font-size: 23px; }
    .tile { width: 68px; }
    .tile .num { font-size: 27px; }
    .stats { gap: 4px 12px; }
    .stats .num { font-size: 17px; }
  }

  /* ---------- 今日 / 統計 ---------- */
  .page h2.sec { font-size: 20px; margin: 28px 0 6px; }
  .page h2.sec:first-child { margin-top: 0; }
  .grid2 { display: grid; gap: 12px; }
  @media (min-width: 1180px) { .grid2 { grid-template-columns: 1fr 1fr; align-items: start; } }
  .og { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 13px 15px; box-shadow: var(--shadow); }
  .og h3 { margin: 0 0 6px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .og h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .og ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .og li { display: grid; grid-template-columns: 82px 1fr; gap: 8px; font-size: 14px; align-items: baseline; }
  .og li button { text-align: left; font-weight: 700; color: var(--good); }
  .og li span { color: var(--muted); font-size: 13px; }
  .og li em { font-style: normal; color: var(--ink); }
  .og .same { font-size: 11px; color: #fff; background: var(--own); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
  .seg { display: inline-grid; grid-template-columns: 1fr 1fr; border-radius: 999px; padding: 4px; margin-bottom: 4px; background: var(--card); border: 1px solid var(--line); position: relative; isolation: isolate; }
  .seg::before { content: ""; position: absolute; z-index: -1; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 999px; background: var(--board);
    transform: translateX(calc(var(--si, 0) * 100%)); transition: transform .4s var(--spring); }
  .seg button { padding: 6px 16px; border-radius: 999px; font-size: 13px; transition: color .2s; }
  .seg button[aria-pressed="true"] { color: var(--lamp); font-weight: 700; }
  table.data { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; font-size: 14px; }
  table.data th, table.data td { padding: 9px 10px; text-align: right; border-top: 1px solid var(--line); }
  table.data th { font-weight: 500; color: var(--muted); font-size: 12px; border-top: 0; }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data td .num, table.data td.num { font-size: 17px; }
  .tblwrap table.data { width: auto; min-width: 100%; }
  .tblwrap table.data th, .tblwrap table.data td { white-space: nowrap; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kpi { background: var(--board); color: #fff; border-radius: var(--r-m); padding: 13px 15px; }
  .kpi b { display: block; font-size: 34px; line-height: 1.05; color: var(--lamp); font-weight: 800; }
  .kpi span { font-size: 12px; color: rgba(255, 255, 255, .68); }
  .draws { display: grid; gap: 12px; }
  @media (min-width: 820px) { .draws { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); } }
  .dg { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 13px 15px; box-shadow: var(--shadow); }
  .dg h3 { margin: 0 0 8px; font-size: 15px; }
  .dg h3 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 88px; }
  .bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .bars div i { width: 100%; background: var(--bar); border-radius: 4px 4px 0 0; }
  .bars div i.top { background: var(--good); }
  .bars div span { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* 骨架載入 */
  .skel { display: grid; gap: 10px; }
  .skel i { display: block; height: 92px; border-radius: var(--r-m); background: var(--card); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .skel i:first-child { height: 112px; border-radius: var(--r-l); background: var(--board); border: 0; }
  .skel i::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ink) 7%, transparent), transparent); }
  .skel i:first-child::after { background: linear-gradient(90deg, transparent, rgba(255, 194, 61, .1), transparent); }
  .skel span { text-align: center; font-size: 13px; color: var(--muted); padding-top: 4px; }

  /* ---------- 動態 ---------- */
  @media (prefers-reduced-motion: no-preference) {
    button:active { transform: scale(.97); }
    .tabs button:active, .seg button:active { transform: none; }
    .rno, .meet, .refresh, .og li button { transition: transform .15s var(--out), background .25s var(--out), color .25s; }
    .skel i::after { animation: shimmer 1.3s infinite; }
    @keyframes shimmer { to { transform: translateX(100%); } }
    .live { animation: pulse 1.4s ease-out infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 90, 71, .65); } 100% { box-shadow: 0 0 0 9px rgba(255, 90, 71, 0); } }
    /* 招牌動畫：賠率變動 → 翻牌，落飛閃紅、回飛閃綠 */
    .tile.chg .num { animation: flap .55s var(--out); }
    .tile.chg.dn { animation: glowDn 1.6s ease-out; }
    .tile.chg.up { animation: glowUp 1.6s ease-out; }
    @keyframes flap { 0% { transform: rotateX(0); } 45% { transform: rotateX(-90deg); opacity: .2; } 55% { transform: rotateX(90deg); opacity: .2; } 100% { transform: rotateX(0); } }
    @keyframes glowDn { 0%, 30% { box-shadow: 0 0 0 2px var(--signal), 0 0 22px -2px var(--signal); } 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 6px 14px -8px rgba(0, 0, 0, .6); } }
    @keyframes glowUp { 0%, 30% { box-shadow: 0 0 0 2px var(--mint), 0 0 22px -2px var(--mint); } 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 6px 14px -8px rgba(0, 0, 0, .6); } }
    .tag.late i::after { transition: width .8s var(--out); }
    /* 轉場：按場次方向滑入 */
    ::view-transition-old(view) { animation: vtOut .22s ease-in both; }
    ::view-transition-new(view) { animation: vtIn .38s var(--out) both; }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
    @keyframes vtOut { to { opacity: 0; transform: translateX(calc(var(--vt-dir, 1) * -24px)); } }
    @keyframes vtIn { from { opacity: 0; transform: translateX(calc(var(--vt-dir, 1) * 32px)); } }
  }
  main { view-transition-name: view; }

  /* ---------- 賠率跑道 ---------- */
  .tw { margin-top: 12px; background: var(--board); color: #fff; border-radius: var(--r-l); padding: 12px 0 10px; box-shadow: var(--shadow); }
  .tw-cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 0 14px 8px; font-size: 12px; color: rgba(255, 255, 255, .6); }
  .tw-cap b { color: #fff; font-size: 15px; margin-right: 8px; }
  .tw-leg { display: flex; gap: 12px; flex-wrap: wrap; }
  .tw-leg i { display: inline-block; vertical-align: -1px; margin-right: 4px; }
  .tw-leg .lm { width: 14px; height: 4px; border-radius: 2px; background: var(--signal); vertical-align: 2px; }
  .tw-leg .lo { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #9DB4FF; }
  .tw-leg .lh { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--signal); }
  .tw-leg .ld { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--mint); }
  .trk { position: relative; margin: 0 14px; border-radius: 14px; overflow: hidden; padding: 3px 0;
    background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .035) 0 12%, transparent 12% 24%), var(--board-2); }
  .trk::after { content: ""; position: absolute; top: 0; bottom: 0; right: 30px; width: 3px; background: repeating-linear-gradient(180deg, #fff 0 6px, #C8102E 6px 12px); opacity: .85; }
  .trk-end { position: absolute; right: 7px; top: 6px; font-size: 10px; color: rgba(255, 255, 255, .7); writing-mode: vertical-rl; letter-spacing: .3em; }
  .ln { position: relative; height: 26px; }
  .ln + .ln { border-top: 1px dashed rgba(255, 255, 255, .06); }
  .ln .trail { position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--signal)); }
  .ln .trail.back { background: linear-gradient(270deg, transparent, var(--mint)); }
  .ln .ghost { position: absolute; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 2px solid #9DB4FF; transition: left .9s var(--out); }
  .ln .dia { position: absolute; top: 50%; width: 11px; height: 11px; margin: -6px 0 0 -6px; transform: rotate(45deg); border: 2px solid #C4A5FF; background: rgba(196, 165, 255, .18); transition: left .9s var(--out); }
  .tw-leg .lv { width: 8px; height: 8px; transform: rotate(45deg); border: 2px solid #C4A5FF; margin-right: 6px; }
  .ai { margin: 12px 14px 0; border-radius: 14px; background: var(--board-2); color: rgba(255, 255, 255, .88); padding: 12px 14px; }
  .ai-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ai-h b { color: #fff; font-size: 15px; }
  .ai-h small { color: rgba(255, 255, 255, .55); font-size: 11px; margin-left: 6px; }
  .ai-btn { border: 1px solid #C4A5FF; color: #E6DAFF; background: transparent; border-radius: 999px; padding: 5px 14px; font: inherit; font-size: 13px; cursor: pointer; }
  .ai-btn:disabled { opacity: .5; cursor: wait; }
  .ai-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .ai-t { margin-top: 8px; font-size: 14px; line-height: 1.7; white-space: pre-wrap; }
  .ai-t:empty { display: none; }
  .ai-t.err { color: #FFB4A8; }
  .ln .sk { position: absolute; top: 50%; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; display: grid; place-items: center; z-index: 2;
    font: 800 13px/1 "Big Shoulders Display", "Barlow Condensed", sans-serif; color: #fff; box-shadow: 0 0 0 2px rgba(0, 0, 0, .25), 0 2px 6px rgba(0, 0, 0, .35); transition: left .9s var(--out); }
  .ln .sk.scr { opacity: .25; }
  .ln .sk.hot { box-shadow: 0 0 0 2px var(--board-2), 0 0 0 4px var(--signal); }
  .ln .sk.drw { box-shadow: 0 0 0 2px var(--board-2), 0 0 0 4px var(--mint); }
  .ln .pin { position: absolute; top: 50%; margin: -9px 0 0 16px; font-size: 11px; font-weight: 700; line-height: 18px; padding: 0 6px; border-radius: 999px; white-space: nowrap; z-index: 3; transition: left .9s var(--out); }
  .ln .pin.hot { background: var(--signal); color: #fff; }
  .ln .pin.drw { background: var(--mint); color: var(--board); }
  .ln .pin.flip { margin-left: -16px; transform: translateX(-100%); }
  .tw-axis { display: flex; justify-content: space-between; margin: 6px 14px 0; padding-right: 22px; font-size: 11px; color: rgba(255, 255, 255, .5); }
  @media (min-width: 820px) { .ln { height: 30px; } }
  @media (prefers-reduced-motion: no-preference) {
    .ln .sk.hot { animation: hotRing 1.6s ease-out infinite; }
    @keyframes hotRing { 0% { box-shadow: 0 0 0 2px var(--board-2), 0 0 0 4px var(--signal), 0 0 0 4px rgba(232, 65, 47, .6); } 100% { box-shadow: 0 0 0 2px var(--board-2), 0 0 0 4px var(--signal), 0 0 0 12px rgba(232, 65, 47, 0); } }
  }

  /* ---------- 落飛預警：頂部 ---------- */
  .alerts { margin-top: 12px; border-radius: var(--r-l); background: var(--board); color: #fff; padding: 12px 14px; box-shadow: var(--shadow);
    border: 1px solid color-mix(in srgb, var(--signal) 60%, transparent); }
  .alerts h2 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--lamp); }
  .alerts h2 small { font-size: 12px; font-weight: 400; color: rgba(255, 255, 255, .6); }
  .alerts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .al { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left;
    padding: 8px 10px; border-radius: var(--r-m); background: var(--board-2); }
  .al .cl { width: 32px; height: 36px; border-radius: 5px 5px 11px 11px; background: #fff; color: var(--board); display: grid; place-items: center; font-size: 21px; font-weight: 800; }
  .al strong { display: block; font-size: 15px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .al span { display: block; font-size: 12px; color: rgba(255, 255, 255, .7); }
  .al em { font-style: normal; font-weight: 700; font-size: 13px; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .al.late em { background: var(--signal); color: #fff; }
  .al.drift em { background: var(--mint); color: var(--board); }
  .al .od { font-size: 22px; font-weight: 800; color: var(--lamp); margin-right: 6px; }
  /* 彈出提示 */
  .toast { position: fixed; z-index: 60; left: 50%; top: calc(10px + env(safe-area-inset-top)); transform: translate(-50%, -150%); width: min(440px, calc(100% - 24px));
    display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; padding: 10px 14px; border-radius: 16px;
    background: var(--board); color: #fff; box-shadow: 0 16px 40px -10px rgba(0, 0, 0, .6), inset 0 0 0 1px var(--signal); transition: transform .5s var(--spring); }
  .toast.show { transform: translate(-50%, 0); }
  .toast .cl { width: 32px; height: 36px; border-radius: 5px 5px 11px 11px; background: var(--signal); color: #fff; display: grid; place-items: center; font-size: 21px; font-weight: 800; }
  .toast.drift .cl { background: var(--mint); color: var(--board); }
  .toast strong { display: block; font-size: 15px; }
  .toast span { font-size: 13px; color: rgba(255, 255, 255, .75); }
  .runner.ping { outline: 3px solid var(--signal); outline-offset: 2px; }
  @media (prefers-reduced-motion: no-preference) {
    .al.new { animation: alIn .6s var(--spring); }
    @keyframes alIn { from { opacity: 0; transform: translateY(-12px) scale(.97); } }
    .runner.ping { animation: ping 1.6s ease-out; }
    @keyframes ping { from { outline-color: var(--signal); } to { outline-color: transparent; } }
  }
</style>

<body>
<div class="app">
  <aside class="side" id="top">
    <div class="brand">香港賽馬分析<span>排位、落飛、心水</span></div>
    <nav class="tabs" id="tabs" aria-label="分頁">
      <button id="tabRace" aria-current="page" onclick="showRaces()">賽事</button>
      <button id="tabDay" onclick="showDay()">今日</button>
      <button id="tabStats" onclick="showStats()">統計</button>
    </nav>
    <div class="meets" id="meets" role="group" aria-label="賽事日"></div>
    <div class="board" id="board" role="group" aria-label="場次"></div>
  </aside>
  <main id="view"><div class="skel" aria-busy="true"><i></i><i></i><i></i><span>讀取賽事中…</span></div></main>
</div>

<script>
  const VENUE = { ST: '沙田', HV: '跑馬地' };
  const S = { meetings: [], meeting: null, raceId: null, stats: null, statPeriod: '近30日' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const API = 'https://script.google.com/macros/s/AKfycbwWEcp0Gtz99q1Ih95xZ7cpga2Jt5QMcJvM-4kG5twO81IPsZEgewGXj__Saup1J2ZD/exec';
  // 經 Apps Script 攞數據；網絡失敗就用上次儲低嘅資料（離線都睇到）
  async function call(fn, ...args) {
    const key = 'hkr:' + fn + ':' + JSON.stringify(args);
    try {
      const r = await fetch(API + '?fn=' + fn + '&args=' + encodeURIComponent(JSON.stringify(args)) + '&t=' + Date.now(), { cache: 'no-store' });
      const j = await r.json();
      if (!j.ok) throw new Error(j.err || '伺服器錯誤');
      try { localStorage.setItem(key, JSON.stringify({ at: Date.now(), data: j.data })); } catch (e) {}
      S.offline = false;
      return j.data;
    } catch (e) {
      let c = null;
      try { c = JSON.parse(localStorage.getItem(key) || 'null'); } catch (x) {}
      if (c) { S.offline = c.at; showOffline(c.at); return c.data; }
      throw e;
    }
  }
  function showOffline(at) {
    let b = document.getElementById('offbar');
    if (!b) { b = document.createElement('div'); b.id = 'offbar'; b.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99;background:#A3523A;color:#fff;font-size:13px;text-align:center;padding:calc(env(safe-area-inset-top) + 4px) 8px 4px'; document.body.appendChild(b); }
    const t = new Date(at); b.textContent = '離線中：顯示 ' + (t.getMonth() + 1) + '/' + t.getDate() + ' ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ' 嘅資料';
    clearTimeout(showOffline.t); showOffline.t = setTimeout(() => b.remove(), 6000);
  }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const dayName = d => { const t = new Date(d + 'T00:00:00+08:00'); return '日一二三四五六'.charAt(t.getDay()); };
  const md = d => { const p = String(d).split('-'); return Number(p[1]) + '月' + Number(p[2]) + '日'; };
  const wide = () => window.matchMedia('(min-width: 820px)').matches;
  const calm = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 骨架載入：用灰色方塊頂住位，唔使對住一行字等
  const skel = msg => `<div class="skel" aria-busy="true"><i></i><i></i><i></i><i></i><span>${msg}</span></div>`;
  // 轉場：有 View Transitions 就用，冇就直接換
  const swap = fn => (document.startViewTransition && !calm()) ? document.startViewTransition(fn) : fn();
  const o1 = x => (x == null || x === '' || isNaN(x)) ? esc(x) : String(Math.round(Number(x) * 10) / 10);

  function fail(e) { $('view').innerHTML = '<div class="empty">讀取失敗：' + esc(e && e.message || e) + '<br>請重新整理頁面再試。</div>'; }

  async function init() {
    try {
      S.meetings = await call('apiMeetings');
      if (!S.meetings.length) { $('view').innerHTML = '<div class="empty">未有排位表。系統每日早上 9 點自動更新。</div>'; return; }
      pickMeeting(S.meetings[0].id);
    } catch (e) { fail(e); }
  }

  function pickMeeting(id) {
    S.meeting = S.meetings.find(m => m.id === id);
    renderMeets();
    renderBoard();
    pickRace(S.meeting.races[0].id);
  }

  function meetLabel(m) { return `${md(m.date)}（${dayName(m.date)}）${VENUE[m.venue] || m.venue}`; }
  function renderMeets(onPick) {
    $('meets').innerHTML = S.meetings.map(m =>
      `<button class="meet" aria-pressed="${m.id === S.meeting.id}" onclick="${onPick || 'pickMeeting'}('${m.id}')">${meetLabel(m)}</button>`).join('');
  }

  function renderBoard() {
    $('board').style.display = '';
    $('board').innerHTML = S.meeting.races.map(r =>
      `<button class="rno" aria-current="${r.id === S.raceId}" aria-label="第${r.no}場 ${r.time}${r.tt ? ' 三T' : ''}" onclick="pickRace('${r.id}')"><b class="num">${r.no}</b><small class="num">${esc(r.time)}</small><span class="info">${esc(r.cls)} ${esc(r.dist)}米${r.n ? ' · ' + r.n + '匹' : ''}</span>${r.tt ? '<i class="ttb">3T</i>' : ''}</button>`).join('');
    const cur = $('board').querySelector('[aria-current="true"]');
    if (cur && !wide()) cur.scrollIntoView({ inline: 'center', block: 'nearest' });
  }

  async function pickRace(id) {
    const rs = S.meeting ? S.meeting.races : [];
    const from = rs.findIndex(r => r.id === S.raceId), to = rs.findIndex(r => r.id === id);
    document.documentElement.style.setProperty('--vt-dir', to >= from ? 1 : -1);
    S.raceId = id;
    renderBoard();
    $('view').innerHTML = skel('讀取排位中…');
    if (!wide()) window.scrollTo(0, 0);
    try { const d = await call('apiRace', id); if (S.raceId === id) swap(() => renderRace(d)); } catch (e) { fail(e); }
  }

  function countdown(d) {
    const left = d.postMs ? Math.round((d.postMs - Date.now()) / 60000) : null;
    if (left == null) return '';
    if (d.runners.some(h => Number(h.pos) > 0)) return '<span class="num">完賽</span><small>已有賽果</small>';
    if (left <= 0) return '<span class="num">已開跑</span><small>等賽果</small>';
    if (left <= 90) return `<span class="num">${left <= 10 ? '<i class="live" aria-hidden="true"></i>' : ''}${left} 分</span><small>開跑前</small>`;
    if (left < 1440) return `<span class="num">${Math.round(left / 60)} 小時</span><small>開跑前約</small>`;
    return `<span class="num">${Math.round(left / 1440)} 日</span><small>開跑前約</small>`;
  }

  function renderRace(d) {
    const r = d.race;
    const head = `<section class="rhead">
      <div class="big num" aria-label="第${r.race_no}場">${r.race_no}</div>
      <h1>${esc(r.race_name)}</h1>
      <div class="clock">${countdown(d)}</div>
      <div class="facts">
        <span><b>${esc(r.class)}</b></span>
        <span><b class="num">${esc(r.distance_m)}</b> 米</span>
        <span>${esc(r.track)} <b>${esc(r.course)}</b></span>
        ${r.going ? `<span>場地 <b>${esc(r.going)}</b></span>` : ''}
        <span>開跑 <b class="num">${esc(String(r.post_time).slice(11, 16))}</b></span>
        ${Number(r.tt_leg) ? `<span class="ttbadge">三T 第${['一', '二', '三'][Number(r.tt_leg) - 1]}關</span>` : ''}
      </div>
    </section>
    <div class="rtools"><span>${d.avgDrawWin ? '綠條係呢個路程嘅檔位歷史勝率（平均 ' + d.avgDrawWin + '%）。紅色賠率格係熱門。' : '紅色賠率格係熱門。'}</span><button class="refresh" id="btnRefresh" onclick="refreshRace()">刷新</button></div>`;
    const maxW = Math.max(20, ...d.runners.map(h => h.drawWin || 0));
    // 記低上次見到嘅賠率：有變就翻牌（落飛閃紅、回飛閃綠）
    S.odds = S.odds || {};
    const prevOdds = S.odds[r.race_id] || {}, nowOdds = {};
    const rows = d.runners.map(h => {
      const formHtml = h.form.map(f => {
        const p = parseInt(f.pos, 10);
        return `<span class="num ${p === 1 ? 'w' : p <= 3 ? 'p' : ''}" title="${esc(f.date)} ${esc(VENUE[f.venue] || f.venue)} ${esc(f.dist)}米 賠率${esc(f.odds)}">${esc(isNaN(p) ? f.pos : p)}</span>`;
      }).join('');
      const isPick = h.model && h.model.value;
      const tags = (isPick ? `<span class="tag value">值博 +${Math.round(h.model.edge * 100)}%</span>` : '') +
        h.tags.map(tagHtml).join('');
      const gate = h.drawWin == null ? `<span class="gate">檔 <span class="num">${esc(h.draw)}</span></span>`
        : `<span class="gate" title="${h.drawN} 次出賽">檔 <span class="num">${esc(h.draw)}</span><i style="--w:${Math.round(h.drawWin / maxW * 100)}%"></i>${h.drawWin}%</span>`;
      const fl = h.flow && !h.scratched ? h.flow : null;
      const was = fl && Math.abs(fl.dropBase) >= 0.1 ? `<span class="was">由 ${o1(fl.oddsBase)} ${fl.dropBase > 0 ? '落' : '回'}</span>` : '';
      const col2 = (h.cond ? `<div class="cond">狀態：${esc(h.cond.line)}${h.cond.fastLast ? `<br>最近快操 ${esc(h.cond.fastLast)}` : ''}</div>` : '') +
        (h.incident && h.incident.text && h.incident.text !== '無特別報告。' ? `<div class="cond">上仗事件（${esc(h.incident.date.slice(5))}，第${esc(h.incident.place)}名）：${esc(h.incident.text.length > 90 ? h.incident.text.slice(0, 90) + '…' : h.incident.text)}</div>` : '') +
        (tags ? `<div class="tags">${tags}</div>` : '');
      const speed = h.model && h.model.figs ? `<span title="最近三仗速度指數：0 係同路程標準時間，正數快過標準（已扣當日場地快慢）">速度 <span class="num">${h.model.figs.split(',').map(n => (Number(n) > 0 ? '+' : '') + n).join(' / ')}</span></span>` : '';
      const po = Number(prevOdds[h.no]), no_ = Number(h.odds);
      if (no_ > 0) nowOdds[h.no] = no_;
      const flip = !h.scratched && po > 0 && no_ > 0 && po !== no_ ? (no_ < po ? ' chg dn' : ' chg up') : '';
      return `<li id="rn${esc(h.no)}" class="runner${h.scratched ? ' scr' : ''}${isPick ? ' pick' : ''}${fl && fl.level >= 2 ? ' flow' + fl.level : ''}">
        <div class="cloth num">${esc(h.no)}</div>
        <div class="info">
          <div class="nm">${esc(h.name)}<small>${esc(h.code)}</small></div>
          <div class="who">騎 <em>${esc(h.jockey)}</em>${h.jWin != null ? ' ' + h.jWin + '%' : ''}　練 <em>${esc(h.trainer)}</em>${h.tWin != null ? ' ' + h.tWin + '%' : ''}</div>
          ${h.owner ? `<div class="who">馬主 <em>${esc(h.owner)}</em></div>` : ''}
          <div class="stats">${gate}<span>負磅 <span class="num">${esc(h.wt)}</span></span><span>評分 <span class="num">${esc(h.rating)}</span></span>${speed}</div>
          ${formHtml ? `<div class="form" aria-label="近績">${formHtml}</div>` : (h.last6 ? `<div class="who">近六仗 ${esc(h.last6)}</div>` : '')}
        </div>
        ${col2 ? `<div class="col2">${col2}</div>` : ''}
        <div class="odds${h.no === d.fav ? ' fav' : ''}">
          <div class="tile${flip}"><span class="num">${h.scratched ? '退出' : esc(h.odds || '-')}</span><small>獨贏</small></div>
          ${was}${h.model && !h.scratched ? `<span class="model">模型 <span class="num">${h.model.pf}</span>%</span>` : ''}${h.pos ? `<span class="res">第${esc(h.pos)}名</span>` : ''}
        </div>
      </li>`;
    }).join('');
    S.odds[r.race_id] = nowOdds;
    $('view').innerHTML = head + alertsHtml(d) + trackHtml(d) + aiHtml(d) + `<div class="rcols">
      <div class="rmain">${flowHtml(d)}<ol class="runners o-runners">${rows}</ol></div>
      <div class="rside">${tipsHtml(d)}${picksHtml(d)}${biasHtml(d)}${jdayHtml(d)}</div>
    </div>`;
    moveTrack();
    scheduleRefresh(d);
  }

  /* 賠率跑道：每匹馬按市場機會（log 尺度）排位，越右越熱門。
     橙色尾跡＝由最早記錄到而家落飛；綠色＝回飛；藍圈＝模型估計；
     紅圈＋%＝最後落飛機會 ≥20%；綠圈＋⚠＝回飛但模型睇好 */
  const SILK = ['#C8102E', '#1D4ED8', '#F59E0B', '#047857', '#7C3AED', '#DB2777', '#0E7490', '#B45309', '#4D7C0F', '#9F1239', '#334155', '#A16207', '#0369A1', '#6D28D9'];
  function trackHtml(d) {
    const live = d.runners.filter(h => !h.scratched && Number(h.odds) > 0);
    if (live.length < 2) return '';
    const inv = live.reduce((a, h) => a + 1 / Number(h.odds), 0), P = o => (1 / o) / inv;
    const ps = live.map(h => P(Number(h.odds)));
    const lo = Math.log(Math.max(.006, Math.min(...ps)) * .8), hi = Math.log(Math.max(...ps) * 1.12);
    const X = p => Math.round((4 + 86 * (Math.log(Math.max(p, Math.exp(lo))) - lo) / (hi - lo)) * 10) / 10;
    const pmSum = live.reduce((a, h) => a + (h.model && Number(h.model.pm) > 0 ? Number(h.model.pm) : 0), 0);
    S.trackX = S.trackX || {};
    const prev = S.trackX[d.race.race_id] || {}, now = {};
    const lanes = d.runners.map(h => {
      const col = SILK[(Number(h.no) - 1) % SILK.length];
      if (h.scratched || !(Number(h.odds) > 0)) return `<div class="ln"><span class="sk scr" style="left:4%;background:${col}">${esc(h.no)}</span></div>`;
      const x = X(P(Number(h.odds))); now[h.no] = x;
      const from = prev[h.no] != null ? prev[h.no] : x;
      const f = h.flow;
      const bx = f && Number(f.oddsBase) > 0 && Math.abs(f.dropBase) >= .05 ? X(P(Number(f.oddsBase))) : null;
      const trail = bx == null ? '' : bx < x ? `<i class="trail" style="left:${bx}%;width:${x - bx}%"></i>` : `<i class="trail back" style="left:${x}%;width:${bx - x}%"></i>`;
      const pf = h.model && Number(h.model.pl) > 0 ? Math.min(X(Number(h.model.pl) / 100), 94) : null;   // 只用即時賠率重計嘅模型機會；冇就唔畫
      const pv = pmSum > 0 && h.model && Number(h.model.pm) > 0 ? Math.min(X(Number(h.model.pm) / pmSum), 94) : null;   // 獨立模型（唔睇賠率），每場重新歸一
      const late = (h.tags || []).map(t => /^最後落飛機會 (\d+)%$/.exec(t.t)).find(Boolean);
      const drift = (h.tags || []).some(t => /回飛但模型睇好/.test(t.t));
      const hot = late && Number(late[1]) >= 20;
      const cls = drift ? ' drw' : hot ? ' hot' : '';
      const pin = drift ? `<span class="pin drw${x > 70 ? ' flip' : ''}" data-x="${x}" style="left:${from}%">⚠ 回飛睇好</span>`
        : hot ? `<span class="pin hot${x > 70 ? ' flip' : ''}" data-x="${x}" style="left:${from}%">${late[1]}%</span>` : '';
      return `<div class="ln">${trail}${pf != null ? `<i class="ghost" style="left:${pf}%"></i>` : ''}${pv != null ? `<i class="dia" style="left:${pv}%" title="獨立模型 ${Math.round(Number(h.model.pm) / pmSum * 100)}%"></i>` : ''}
        <button class="sk${cls}" data-x="${x}" style="left:${from}%;background:${col}" onclick="jumpRunner(${h.no})" aria-label="${esc(h.no)}號 ${esc(h.name)}，獨贏 ${esc(h.odds)}${hot ? '，最後落飛機會 ' + late[1] + '%' : ''}${drift ? '，回飛但模型睇好' : ''}">${esc(h.no)}</button>${pin}</div>`;
    }).join('');
    S.trackX[d.race.race_id] = now;
    return `<section class="tw" aria-label="賠率跑道">
      <div class="tw-cap"><span><b>賠率跑道</b>越近終點越熱門，撳馬號跳去嗰匹馬</span>
        <span class="tw-leg"><span><i class="lm"></i>落飛</span><span><i class="lo"></i>模型（按即時賠率）</span><span><i class="lv"></i>獨立模型（唔睇賠率）</span><span><i class="lh"></i>最後落飛 ≥20%</span><span><i class="ld"></i>回飛但模型睇好</span></span></div>
      <div class="trk"><span class="trk-end">熱門</span>${lanes}</div>
      <div class="tw-axis"><span>冷門</span><span>${d.flow && d.flow.baseAt ? '落飛由 ' + esc(d.flow.baseAt) + ' 起計' : ''}</span></div></section>`;
  }
  /* AI 解說：撳掣先叫 Gemini（慳額度），伺服器快取 10 分鐘；本機記住同一場上次結果 */
  S.ai = S.ai || {};
  function aiHtml(d) {
    const rid = d.race.race_id, a = S.ai[rid];
    const meta = a && a.text ? `${esc(a.at)} 生成${a.oddsAt ? '・賠率 ' + esc(a.oddsAt) : ''}` : 'Gemini 根據賠率、模型、落飛同上仗事件寫';
    return `<section class="ai" aria-label="AI 解說"><div class="ai-h"><span><b>AI 解說</b><small id="aiMeta">${meta}</small></span>
      <button class="ai-btn" id="aiBtn" onclick="loadAi('${esc(rid)}')">${a && a.text ? '重新分析' : '分析呢場'}</button></div>
      <div class="ai-t${a && a.err ? ' err' : ''}" id="aiText">${a ? esc(a.text || a.err) : ''}</div></section>`;
  }
  async function loadAi(rid) {
    const b = $('aiBtn'), t = $('aiText');
    b.disabled = true; b.textContent = '分析緊…'; t.className = 'ai-t'; t.textContent = '';
    try {
      const r = await call('apiAiNote', rid);
      S.ai[rid] = r;
    } catch (e) { S.ai[rid] = { err: 'AI 解說暫時用唔到：' + (e.message || e) }; }
    if (S.raceId !== rid || !$('aiBtn')) return;
    const a = S.ai[rid];
    t.className = 'ai-t' + (a.err ? ' err' : ''); t.textContent = a.text || a.err;
    $('aiMeta').textContent = a.text ? a.at + ' 生成' + (a.oddsAt ? '・賠率 ' + a.oddsAt : '') : '';
    b.disabled = false; b.textContent = a.text ? '重新分析' : '再試';
  }
  // 刷新後：由上次位置滑去新位置
  function moveTrack() {
    const els = document.querySelectorAll('.trk [data-x]');
    if (!els.length) return;
    requestAnimationFrame(() => requestAnimationFrame(() => els.forEach(el => { el.style.left = el.dataset.x + '%'; })));
  }

  /* 落飛預警：最後落飛機會 ≥20% 或「回飛但模型睇好」嘅馬，集中喺頂部顯示；新出現嘅會彈出提示 */
  function alertList(d) {
    const out = [];
    d.runners.forEach(h => {
      if (h.scratched) return;
      const late = (h.tags || []).map(t => /^最後落飛機會 (\d+)%$/.exec(t.t)).find(Boolean);
      const drift = (h.tags || []).find(t => /回飛但模型睇好/.test(t.t));
      if (drift) out.push({ k: 'drift', no: h.no, name: h.name, odds: h.odds, label: '回飛・模型睇好', why: '近 10 分鐘賠率 ' + ((/（(.+)）/.exec(drift.t) || [])[1] || '上升') + '，模型仍然睇好', score: 100 });
      if (late && Number(late[1]) >= 20) out.push({ k: 'late', no: h.no, name: h.name, odds: h.odds, label: '最後落飛 ' + late[1] + '%', why: '臨開跑大機會再有錢落', score: Number(late[1]) });
    });
    return out.sort((a, b) => b.score - a.score);
  }
  function alertsHtml(d) {
    const list = alertList(d), rid = d.race.race_id;
    S.alertSeen = S.alertSeen || {};
    const seen = S.alertSeen[rid] || {}, now = {};
    const fresh = [];
    list.forEach(a => { const key = a.k + a.no; now[key] = 1; if (S.alertSeen[rid] && !seen[key]) fresh.push(a); });
    S.alertSeen[rid] = now;
    if (fresh.length) setTimeout(() => toast(fresh[0]), 300);
    if (!list.length) return '';
    return `<section class="alerts" aria-live="polite"><h2>落飛預警<small>撳一下跳去嗰匹馬</small></h2><ul>${list.map(a =>
      `<li><button class="al ${a.k}${fresh.includes(a) ? ' new' : ''}" onclick="jumpRunner(${a.no})"><span class="cl num">${esc(a.no)}</span>
        <span><strong>${esc(a.name)}</strong><span>${esc(a.why)}</span></span>
        <span><b class="od num">${esc(a.odds || '-')}</b><em>${esc(a.label)}</em></span></button></li>`).join('')}</ul></section>`;
  }
  function toast(a) {
    let t = $('toast');
    if (!t) { t = document.createElement('button'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); }
    t.className = 'toast' + (a.k === 'drift' ? ' drift' : '');
    t.innerHTML = `<span class="cl num">${esc(a.no)}</span><span><strong>${esc(a.no)} 號 ${esc(a.name)}：${esc(a.label)}</strong><span>${esc(a.why)}</span></span>`;
    t.onclick = () => { t.classList.remove('show'); jumpRunner(a.no); };
    requestAnimationFrame(() => t.classList.add('show'));
    clearTimeout(S.toastT); S.toastT = setTimeout(() => t.classList.remove('show'), 6000);
  }
  function jumpRunner(no) {
    const el = $('rn' + no); if (!el) return;
    el.scrollIntoView({ block: 'center', behavior: calm() ? 'auto' : 'smooth' });
    el.classList.remove('ping'); void el.offsetWidth; el.classList.add('ping');
  }

  // 開跑前 150 分鐘至開跑後 3 分鐘：每分鐘自動更新；開跑前 3 分鐘內每 15 秒
  function scheduleRefresh(d) {
    clearTimeout(S.timer);
    const finished = d.runners.some(h => Number(h.pos) > 0);
    const left = d.postMs ? (d.postMs - Date.now()) / 60000 : null;
    if (finished || left == null || left < -3 || left > 150) return;
    const id = d.race.race_id;
    S.timer = setTimeout(async () => {
      if (S.raceId !== id || $('tabRace').getAttribute('aria-current') !== 'page') return;
      if (document.hidden) { scheduleRefresh(d); return; }
      try { const y = window.scrollY; renderRace(await call('apiRace', id)); window.scrollTo(0, y); }
      catch (e) { scheduleRefresh(d); }
    }, left <= 3 ? 15000 : 60000);
  }

  // 手動刷新：即刻攞最新賠率、落飛同心水
  async function refreshRace() {
    const b = $('btnRefresh');
    if (b) { b.disabled = true; b.textContent = '更新中…'; }
    clearTimeout(S.timer);
    const id = S.raceId, y = window.scrollY;
    try { const d = await call('apiRace', id); if (S.raceId === id) { renderRace(d); window.scrollTo(0, y); } }
    catch (e) { if (b) { b.disabled = false; b.textContent = '再試'; } }
  }

  // 標籤：「最後落飛機會 N%」用細計量條顯示，其他照舊
  function tagHtml(t) {
    const m = /^最後落飛機會 (\d+)%$/.exec(t.t);
    if (m) { const p = Number(m[1]);
      return `<span class="tag late${p >= 20 ? ' hi' : ''}" title="開跑前 5 分鐘至開跑時，賠率再跌 10% 或以上嘅機會（按過往落飛紀錄計）">最後落飛 <i style="--p:${Math.min(100, p * 2.5)}%"></i><b>${p}%</b></span>`; }
    return `<span class="tag ${t.k}">${t.t}</span>`;
  }

  function tipsHtml(d) {
    const t = d.tips;
    if (!t) return '';
    const fmt = x => `${x.a}-${x.b}　${x.p}%${x.odds ? `，賠率 ${x.odds}` : ''}${x.ev ? `，期望 ${x.ev}` : ''}`;
    const chips = arr => arr.map(x => `<span class="chip${x.ev && x.ev >= 1.05 ? ' v' : ''}">${fmt(x)}</span>`).join('');
    const bk = t.banker;
    return `<div class="panel tips o-tips"><h2>今場心水 <small>${d.liveAt ? '賠率更新 ' + esc(d.liveAt) : ''}</small></h2>
      <div class="row"><b>膽</b><div class="banker"><span class="num">${bk.no}</span><strong>${esc(bk.name)}</strong>
        <span class="sub">勝出約 ${bk.win}%，入位約 ${bk.place}%${bk.odds ? '，獨贏 ' + esc(bk.odds) : ''}${bk.why ? '。' + esc(bk.why) : ''}</span></div></div>
      <div class="row"><b>拖</b><div class="chips">${t.drag.map(x => `<span class="chip">${x.no} ${esc(x.name)}${x.why ? '（' + esc(x.why) + '）' : ''}</span>`).join('')}</div></div>
      <div class="row"><b>Q</b><div class="chips">${chips(t.q)}</div></div>
      <div class="row"><b>位置Q</b><div class="chips">${chips(t.pq)}</div></div>
      ${t.value.length ? `<div class="row"><b>值博</b><div class="chips">${t.value.map(x => `<span class="chip v">${x.kind} ${fmt(x)}</span>`).join('')}</div></div>` : ''}
      <small class="fine">計法：${esc(t.basis)}，再按落飛（加）、回飛同體重大減（減）微調。Q / 位置Q 機會由勝出機會推算${t.hasExotic ? '，同馬會賠率比較，「期望」高過 1 即係賠率比估計機會抵（黃色）' : '（Q / 位置Q 未開售）'}。只供參考，唔保證贏，請量力而為。</small></div>`;
  }

  function money(x) {
    const a = Math.abs(x), sign = x < 0 ? '−' : '+';
    return sign + (a >= 1e6 ? (a / 1e6).toFixed(1) + ' 百萬' : Math.round(a / 1e4) + ' 萬');
  }

  function flowHtml(d) {
    const finished = d.runners.some(h => Number(h.pos) > 0);
    const f = d.flow;
    if (!f) {
      if (finished) return '';
      return `<div class="panel flowbox quiet o-flow"><h2>落飛監察</h2><p>賽馬日第一場開跑前約 2 個半鐘開始記錄獨贏賠率同彩池，開跑前 5 分鐘起每 30 秒記一次。有大額投注集中買嘅馬會喺呢度紅色顯示。</p></div>`;
    }
    const left = d.postMs ? Math.round((d.postMs - Date.now()) / 60000) : null;
    const when = finished ? '賽後回顧' : left == null ? '' : left > 0 ? `開跑前 ${left} 分鐘` : '已開跑';
    const lvName = { 3: '大手落飛', 2: '落飛', 1: '有飛落' };
    const pct = x => x == null ? '' : (x >= 0 ? '↓' : '↑') + Math.abs(Math.round(x * 100)) + '%';
    const cls = x => x == null ? '' : x >= 0.08 ? 'dn2' : x >= 0.03 ? 'dn' : x <= -0.08 ? 'up' : '';
    const runners = d.runners.filter(h => h.flow && !h.scratched);
    const hasPQ = runners.some(h => h.flow.pla || h.flow.qr != null);
    const flagged = runners.filter(h => h.flow.level > 0 || h.flow.placeFlow || h.flow.qFlow)
      .sort((a, b) => b.flow.level - a.flow.level || (b.flow.late ? 1 : 0) - (a.flow.late ? 1 : 0) || (b.flow.placeFlow ? 1 : 0) - (a.flow.placeFlow ? 1 : 0) || b.flow.exBase - a.flow.exBase);
    const lvText = x => [x.late ? '最後落飛' : lvName[x.level], x.placeFlow ? '位置落飛' : '', x.qFlow ? 'Q落飛' : ''].filter(Boolean).join('、');
    const sum = flagged.length ? `<div class="tblwrap"><table class="ftbl">
      <thead><tr><th class="hn">馬</th><th>訊號</th><th>起始</th><th>最新</th><th>全程</th><th>近10分</th><th>最後5分</th><th>額外資金</th>${hasPQ ? '<th>位置賠率</th><th>位置錢比</th><th>Q錢比</th>' : ''}</tr></thead>
      <tbody>${flagged.map(h => { const x = h.flow; return `<tr class="lv${x.level}">
        <td class="hn"><b class="num">${esc(h.no)}</b> ${esc(h.name)}</td>
        <td><span class="lvb">${lvText(x)}</span></td>
        <td class="num">${o1(x.oddsBase)}</td><td class="num"><b>${o1(x.odds)}</b></td>
        <td class="num ${cls(x.dropBase)}">${pct(x.dropBase)}</td><td class="num ${cls(x.drop10)}">${pct(x.drop10)}</td>
        <td class="num ${cls(x.drop5)}">${pct(x.drop5)}</td><td class="num">${money(x.exBase)}</td>${hasPQ ? `<td class="num ${cls(x.plaDrop)}">${x.pla ? o1(x.plaBase) + '→' + o1(x.pla) : '-'}</td><td class="num${x.pr >= 1.35 ? ' dn' : ''}">${x.pr != null ? x.pr : '-'}</td><td class="num${x.qFlow ? ' dn' : ''}">${x.qr != null ? x.qr : '-'}</td>` : ''}</tr>`; }).join('')}</tbody></table></div>`
      : '<p>暫時冇明顯落飛，賠率走勢平穩。</p>';
    const T = d.flowTable;
    let trend = '';
    if (T && T.cols.length > 1) {
      const lvOf = no => { const h = runners.find(r => String(r.no) === String(no)); return h ? h.flow.level : 0; };
      const nameOf = no => { const h = d.runners.find(r => String(r.no) === String(no)); return h ? h.name : ''; };
      const nos = Object.keys(T.rows).sort((a, b) => { const ra = T.rows[a], rb = T.rows[b]; return (ra[ra.length - 1] || 999) - (rb[rb.length - 1] || 999); });
      const open = window.matchMedia('(min-width: 1180px)').matches || finished || (left != null && left <= 15);
      const ptab = (rowsOf, title) => `<details class="trend"><summary class="fth">${title}<small>紅色係比上一格跌</small></summary><div class="tblwrap"><table class="ftbl trend">
        <thead><tr><th class="hn">馬</th>${T.cols.map(c => `<th>${esc(c.label)}<br><small>${esc(c.at)}</small></th>`).join('')}</tr></thead>
        <tbody>${nos.map(no => { const r = rowsOf[no] || []; return `<tr class="lv${lvOf(no)}"><td class="hn"><b class="num">${esc(no)}</b> ${esc(nameOf(no))}</td>${r.map((o, i) => {
          const p = i ? r[i - 1] : null; const ch = o && p ? 1 - o / p : null;
          return `<td class="num ${cls(ch)}${i === r.length - 1 ? ' last' : ''}">${o == null ? '-' : o1(o)}</td>`; }).join('')}</tr>`; }).join('')}</tbody></table></div></details>`;
      trend = `<details class="trend"${open ? ' open' : ''}><summary class="fth">賠率走勢（${nos.length} 匹，${T.cols.length} 個時間點）<small>紅色係比上一格跌（落飛），綠色係回飛</small></summary><div class="tblwrap"><table class="ftbl trend">
        <thead><tr><th class="hn">馬</th>${T.cols.map(c => `<th>${esc(c.label)}<br><small>${esc(c.at)}</small></th>`).join('')}</tr></thead>
        <tbody>${nos.map(no => { const r = T.rows[no]; return `<tr class="lv${lvOf(no)}"><td class="hn"><b class="num">${esc(no)}</b> ${esc(nameOf(no))}</td>${r.map((o, i) => {
          const p = i ? r[i - 1] : null; const ch = o && p ? 1 - o / p : null;
          return `<td class="num ${cls(ch)}${i === r.length - 1 ? ' last' : ''}">${o == null ? '-' : o1(o)}</td>`; }).join('')}</tr>`; }).join('')}</tbody></table></div></details>`;
      if (T.pla) trend += ptab(T.pla, '位置賠率走勢');
    }
    return `<div class="panel flowbox o-flow"><h2>落飛監察 <small>${when}</small></h2>
      <p class="meta">更新 ${esc(f.at)}，獨贏彩池約 $${(f.pool / 1e6).toFixed(1)} 百萬，由 ${esc(f.baseAt)} 開始比較。開跑前 5 分鐘起每 30 秒記錄。</p>
      ${sum}${trend}
      <small class="fine">額外資金＝估計投注額增幅，減去按原本比例應得嘅增幅（彩池 × 82.5% ÷ 賠率推算）。位置錢比＝位置彩池實際資金份額 ÷ 按獨贏推算應有份額，高過 1 即係位置錢重過獨贏；Q錢比同理計 Q 彩池。位置落飛＝位置錢比明顯上升而且位置賠率跌。落飛只代表有人集中大手買，唔代表一定贏。</small></div>`;
  }

  function picksHtml(d) {
    if (!d.analysed) return '<div class="panel picks o-picks"><h2>值博之選</h2><p>未有模型分析。賽馬日系統會自動分析。</p></div>';
    const picks = d.runners.filter(h => h.model && h.model.value && !h.scratched).sort((a, b) => b.model.edge - a.model.edge);
    const at = (d.runners.find(h => h.model) || {}).model.at || '';
    const body = picks.length ? `<ol>${picks.map(h => `<li><b class="num">${esc(h.no)}</b><strong>${esc(h.name)}</strong>
        <span>模型 ${h.model.pf}% 對賠率 ${h.model.pp}%（${esc(h.odds)} 倍）${h.model.reasons ? '，' + esc(h.model.reasons) : ''}</span></li>`).join('')}</ol>`
      : '<p>今場模型冇搵到值博嘅馬，賠率已大致反映實力。</p>';
    return `<div class="panel picks o-picks"><h2>值博之選</h2>${body}<small class="fine">分析時間 ${esc(at)}。只供參考，唔保證贏，請量力而為。</small></div>`;
  }

  // 當日跑道偏差 + 預計步速
  function biasHtml(d) {
    const b = d.bias, pace = d.pace;
    const name = no => { const h = d.runners.find(x => Number(x.no) === Number(no)); return h ? h.name : ''; };
    const paceLine = pace && pace.front && pace.front.length ? `<p class="pace">預計前置：${pace.front.map(n => `<b>${n}</b> ${esc(name(n))}`).join('、')}${pace.front.length === 1 ? '（冇對手爭放）' : pace.contested ? '（多駒爭放，步速可能快）' : ''}</p>` : '';
    if (!b || !b.races) return `<div class="panel bias o-bias"><h2>跑道偏差 <small>今日${b && b.track === 'AW' ? '全天候' : '草地'}</small></h2>${paceLine}<p class="note">今日同類跑道未有跑完嘅場次。每場跑完約 10 至 20 分鐘後更新，比較前置、內檔、後追馬入三甲率同歷史平均。</p></div>`;
    return `<div class="panel bias o-bias"><h2>跑道偏差 <small>今日${b.track === 'AW' ? '全天候' : '草地'}已跑 ${b.races} 場</small></h2>${paceLine}
      ${b.items.map(x => `<div class="bi${x.strong ? ' strong' : x.weak ? ' weak' : ''}"><span>${esc(x.label)}${x.strong ? '　今日著數' : x.weak ? '　今日蝕底' : ''}</span><span><span class="num">${x.rate == null ? '-' : x.rate + '%'}</span></span><small>入三甲 ${x.top3}/${x.n}，歷史平均 ${x.base == null ? '-' : x.base + '%'}</small></div>`).join('')}
      ${b.winners.length ? `<small class="fine">頭馬：${b.winners.map(w => `第${w.race}場 ${w.draw || '-'} 檔，早段第 ${w.early || '-'} 位`).join('；')}</small>` : ''}
      <small class="fine">場次少嘅時候偏差可能只係巧合；至少 9 匹先會標「今日著數」。</small></div>`;
  }

  // 今日騎師戰績：今場之前嘅冠、亞、季同已騎場數
  function jdayHtml(d) {
    const js = (d.dayJockeys || []).filter(j => j.done > 0);
    if (!js.length) return '';
    return `<div class="panel o-jday"><h2>今日騎師戰績 <small>今場之前</small></h2>
      <table class="jtbl"><thead><tr><th>騎師</th><th>冠</th><th>亞</th><th>季</th><th>上名</th><th>已騎</th></tr></thead><tbody>${js.map(j => {
        const top = j.wins + (j.second || 0) + (j.third || 0);
        return `<tr class="${j.wins >= 2 ? 'hot' : (top === 0 && j.done >= 3 ? 'dry' : '')}"><td>${esc(j.name)}</td><td><span class="num">${j.wins}</span></td><td><span class="num">${j.second || 0}</span></td><td><span class="num">${j.third || 0}</span></td><td><span class="num">${top}</span></td><td><span class="num">${j.done}</span></td></tr>`;
      }).join('')}</tbody></table></div>`;
  }

  function setTab(id) {
    const ids = ['tabRace', 'tabDay', 'tabStats'];
    ids.forEach(t => t === id ? $(t).setAttribute('aria-current', 'page') : $(t).removeAttribute('aria-current'));
    $('tabs').style.setProperty('--ti', ids.indexOf(id));
  }

  function showRaces() {
    setTab('tabRace');
    $('meets').style.display = '';
    if (S.meeting) { renderMeets(); renderBoard(); pickRace(S.raceId); } else init();
  }

  async function showStats() {
    setTab('tabStats'); clearTimeout(S.timer);
    $('meets').style.display = 'none'; $('board').style.display = 'none';
    $('view').innerHTML = skel('讀取統計中…');
    try { S.stats = S.stats || await call('apiStats'); renderStats(); } catch (e) { fail(e); }
  }

  // 今日總覽：同馬主、相關馬主、馬匹狀態提示
  async function showDay() {
    setTab('tabDay'); clearTimeout(S.timer);
    if (!S.meeting) { await init(); setTab('tabDay'); }
    $('meets').style.display = ''; $('board').style.display = 'none';
    renderMeets('pickDay');
    $('view').innerHTML = skel('讀取今日總覽中…');
    try { renderDay(await call('apiDay', S.meeting.id)); } catch (e) { fail(e); }
  }
  function pickDay(id) { S.meeting = S.meetings.find(m => m.id === id); S.raceId = S.meeting.races[0].id; showDay(); }
  function goRace(no) {
    const r = S.meeting.races.find(x => Number(x.no) === Number(no));
    if (!r) return;
    S.raceId = r.id; showRaces(); window.scrollTo(0, 0);
  }
  function horseBtn(x) { return `<button onclick="goRace(${x.race})">第${x.race}場 ${x.no}號</button>`; }

  function renderDay(d) {
    const same = d.groups.filter(g => g.kind === 'same'), rel = d.groups.filter(g => g.kind === 'related');
    const grp = g => {
      const cnt = {};
      g.horses.forEach(x => { cnt[x.race] = (cnt[x.race] || 0) + 1; });
      return `<div class="og"><h3>${esc(g.kind === 'same' ? g.owner : '共同人名：' + g.owner)}<small>${g.horses.length} 匹出賽${g.kind === 'related' ? '，' + g.owners.map(esc).join(' / ') : ''}</small></h3><ul>${
        g.horses.map(x => `<li>${horseBtn(x)}<span><em>${esc(x.name)}</em>${cnt[x.race] > 1 ? '<b class="same">同場</b>' : ''}　騎 ${esc(x.jockey)}　練 ${esc(x.trainer)}${x.odds ? '　賠率 ' + esc(x.odds) : ''}${g.kind === 'related' ? '　' + esc(x.owner) : ''}</span></li>`).join('')}</ul></div>`;
    };
    const notes = d.notes.length ? `<div class="grid2">${d.notes.map(n => `<div class="og"><ul><li>${horseBtn(n)}<span><em>${esc(n.name)}</em>　騎 ${esc(n.jockey)}　練 ${esc(n.trainer)}<div class="tags">${n.tags.map(t => `<span class="tag ${t.k}">${esc(t.t)}</span>`).join('')}</div></span></li></ul></div>`).join('')}</div>`
      : `<p class="note">${d.condCount ? '今日冇特別要留意嘅馬匹狀態。' : '馬匹狀態未下載。賽馬日前一日起，系統每 3 個鐘自動更新。'}</p>`;
    $('view').innerHTML = `<div class="page">
      <h2 class="sec">同馬主</h2>
      <p class="note">同一個馬主今日有幾匹馬出賽。標「同場」即係同一場有兩匹或以上。只作參考，並不代表有任何安排。</p>
      ${same.length ? `<div class="grid2">${same.map(grp).join('')}</div>` : '<p class="note">今日冇馬主有兩匹或以上出賽（或者馬主資料未齊）。</p>'}
      <h2 class="sec">相關馬主</h2>
      <p class="note">馬主名唔同，但有共同人名（例如「劉寶文」同「劉寶文與吳慧思」）。</p>
      ${rel.length ? `<div class="grid2">${rel.map(grp).join('')}</div>` : '<p class="note">今日冇發現相關馬主。</p>'}
      <h2 class="sec">馬匹狀態提示</h2>
      <p class="note">近半年傷患、曾流鼻血、長休復出、體重大變（±15 磅）、配備改變、近期試閘、兩週冇快操、上仗有藉口而跑輸、上仗健康問題。資料來自馬會傷患紀錄、晨操紀錄同競賽事件報告。</p>
      ${notes}</div>`;
  }

  function modelHtml(m) {
    if (!m || !m.fit) return '<h2 class="sec">模型表現</h2><p class="note">模型未訓練。歷史賽果回補完成後會自動訓練。</p>';
    const f = m.fit, l = m.live;
    const gain = Math.round((f.r2c - f.r2p) * 10000) / 100;
    return `<h2 class="sec">模型表現</h2>
      <p class="note">用 ${f.train} 場訓練，再用 ${f.test} 場（${esc(f.testFrom)} 至 ${esc(f.testTo)}）測試，訓練時間 ${esc(f.fittedAt)}。</p>
      <div class="kpis">
        <div class="kpi"><b class="num">${gain > 0 ? '+' : ''}${gain}</b><span>準確度比單睇賠率（R² 百分點）</span></div>
        <div class="kpi"><b class="num">${f.bets}</b><span>測試期值博次數，中 ${f.wins} 次</span></div>
        <div class="kpi"><b class="num">${f.roi > 0 ? '+' : ''}${f.roi}%</b><span>測試期回報率</span></div>
      </div>
      <p class="note">實戰紀錄：${l.bets ? `值博 ${l.bets} 次，中 ${l.wins} 次，回報率 ${l.roi}%` : '未有已完賽嘅值博紀錄'}。準確度增幅細於 0 代表模型未有幫助，應以賠率為主。</p>`;
  }

  function folkHtml(rows) {
    if (!rows || !rows.length) return '<h2 class="sec">民間說法驗證</h2><p class="note">未計算。每晚 11 點自動更新。</p>';
    return `<h2 class="sec">民間說法驗證</h2>
      <p class="note">「實際 / 預期」係實際頭馬數除以賠率預期頭馬數。約 1 代表賠率已反映晒；明顯高過 1 而且樣本多先值得留意。回報率按每注 $10 計，扣佣後全部馬平均約 −20%。</p>
      <div class="tblwrap"><table class="data"><thead><tr><th>說法</th><th>出賽</th><th>頭馬</th><th>預期</th><th>實際/預期</th><th>回報率</th></tr></thead><tbody>${
        rows.map(r => `<tr><td>${esc(r.description)}</td><td class="num">${r.runners}</td><td class="num">${r.wins}</td><td class="num">${r.expected_wins}</td><td class="num">${r.ae_ratio === '' ? '-' : r.ae_ratio}</td><td class="num">${r.roi_pct === '' ? '-' : r.roi_pct + '%'}</td></tr>`).join('')
      }</tbody></table></div>`;
  }

  function ownerHtml(o) {
    if (!o || !o.total) return '<h2 class="sec">董事馬</h2><p class="note">馬主資料下載緊，完成後會顯示。</p>';
    const st = o.stewards.length ? `<div class="tblwrap"><table class="data"><thead><tr><th>董事馬</th><th>馬主</th><th>練馬師</th><th>出賽</th><th>頭馬</th></tr></thead><tbody>${
      o.stewards.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.owner)}</td><td>${esc(x.trainer)}</td><td class="num">${x.starts}</td><td class="num">${x.wins}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="note">暫時未搵到馬主名包含現任董事名字嘅馬。</p>';
    return `<h2 class="sec">董事馬</h2><p class="note">按馬主名稱比對 2026/27 年度董事名單，只作統計參考，並不代表有任何不當。</p>${st}`;
  }

  function signalHtml(sg) {
    if (!sg || !sg.rows || !sg.rows.length) return '<h2 class="sec">訊號成績表</h2><p class="note">未有紀錄。每個賽馬日晚上 11 點自動加入當日結果。</p>';
    return `<h2 class="sec">訊號成績表</h2>
      <p class="note">每個訊號觸發過嘅馬實際入三甲幾多，同按最終賠率推算嘅預期比較（${sg.days} 個賽馬日）。「實際/預期」明顯高過 1、而且匹數夠多，先代表賠率未反映到呢個訊號。回報率係每注 $10 買獨贏。</p>
      <div class="tblwrap"><table class="data"><thead><tr><th>訊號</th><th>匹數</th><th>入三甲</th><th>三甲率</th><th>預期</th><th>實際/預期</th><th>頭馬</th><th>獨贏回報</th></tr></thead><tbody>${
        sg.rows.map(r => `<tr><td>${esc(r.signal)}</td><td class="num">${r.n}</td><td class="num">${r.top3}</td><td class="num">${r.top3Pct}%</td><td class="num">${r.exp3}</td><td class="num">${r.ae3 == null ? '-' : r.ae3}</td><td class="num">${r.wins}</td><td class="num">${r.roi == null ? '-' : r.roi + '%'}</td></tr>`).join('')
      }</tbody></table></div>`;
  }

  function setPeriod(p) { S.statPeriod = p; renderStats(); }

  function renderStats() {
    const s = S.stats, recent = S.statPeriod === '近30日';
    const tbl = (rows, label) => rows.length ? `<table class="data"><thead><tr><th>${label}</th><th>出賽</th><th>頭馬</th><th>勝率</th><th>上名率</th></tr></thead><tbody>${
      rows.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${r.starts}</td><td class="num">${r.wins}</td><td class="num">${r.win_pct}%</td><td class="num">${r.top3_pct}%</td></tr>`).join('')
    }</tbody></table>` : '<div class="empty">資料未夠，等回補完成。</div>';
    const draws = s.draws.map(g => {
      const max = Math.max(...g.rows.map(x => x.win), 1);
      const best = Math.max(...g.rows.map(x => x.win));
      return `<div class="dg"><h3>${VENUE[g.venue] || g.venue} ${esc(g.course)} <span class="num">${g.dist}</span>米<small>${g.n} 次出賽</small></h3>
        <div class="bars" role="img" aria-label="各檔位勝率">${g.rows.map(x =>
          `<div title="${x.draw} 檔：勝率 ${x.win}%，${x.starts} 次"><i class="${x.win === best ? 'top' : ''}" style="height:${Math.max(2, x.win / max * 70)}px"></i><span class="num">${x.draw}</span></div>`).join('')}</div></div>`;
    }).join('');
    $('view').innerHTML = `<div class="page">
      <div class="seg" role="group" aria-label="期間" style="--si:${recent ? 0 : 1}">
        <button aria-pressed="${recent}" onclick="setPeriod('近30日')">近 30 日</button>
        <button aria-pressed="${!recent}" onclick="setPeriod('全部')">全部紀錄</button>
      </div>
      ${signalHtml(s.signals)}
      ${modelHtml(s.model)}
      <div class="grid2">
        <div><h2 class="sec">騎師</h2><p class="note">基於 ${s.resultRows} 行賽果，按頭馬數排序。</p>${tbl(recent ? s.jockeys : s.jockeysAll, '騎師')}</div>
        <div><h2 class="sec">練馬師</h2><p class="note">按頭馬數排序。</p>${tbl(recent ? s.trainers : s.trainersAll, '練馬師')}</div>
      </div>
      ${folkHtml(s.folk)}
      ${ownerHtml(s.owners)}
      <h2 class="sec">檔位勝率</h2><p class="note">每組代表一個馬場、賽道及路程；最高勝率嘅檔位用深綠色。</p>
      <div class="draws">${draws || '<div class="empty">資料未夠，等回補完成。</div>'}</div></div>`;
  }

  init();
</script>
</body>
</html>
